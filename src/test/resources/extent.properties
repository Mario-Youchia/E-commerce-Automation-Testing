extent.reporter.spark.start=true

extent.reporter.spark.out=test-output/HTMLReport/E-Commerce_Automation_Testing_Report.html
extent.reporter.spark.config=src/test/resources/spark-config.xml

screenshot.dir=test-output/Screenshots/
screenshot.rel.path=../Screenshots/

extent.reporter.pdf.start=true
extent.reporter.pdf.out=test-output/PdfReport/E-Commerce_Automation_Testing_Report.pdf

basefolder.name=GeneratedReports/reports
basefolder.datetimepattern=d-MMM-YY HH-mm-ss

extent.reporter.spark.vieworder=dashboard,test,category,exception,author,device,log
systeminfo.OS=Local test environment
systeminfo.Tester\ Name=Automation Tester
systeminfo.Project=E-commerce Website Automation Testing
systeminfo.Browser=Google Chrome